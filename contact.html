<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact – Nutri·Neuro</title>
<meta name="description" content="Get in touch with questions or to start working together.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header id="site-header"></header>
<main>

<div class="container page-head"><p class="eyebrow">Contact</p><h1>Say hello</h1><p>Questions about coaching, collaborations or talks? Write me and I'll reply within 2 working days.</p></div>
<section style="padding-top:24px"><div class="container split">
  <form class="form" data-form="contact">
    <label>Name<input name="name" required></label>
    <label>Email<input type="email" name="email" required></label>
    <label>I'm interested in<select name="topic"><option>Nutrition &amp; mental wellbeing</option><option>Hormonal balance</option><option>General nutrition</option><option>Collaboration / speaking</option><option>Other</option></select></label>
    <label>Message<textarea name="message" rows="6" required></textarea></label>
    <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off">
    <button class="btn">Send message</button>
    <p class="form-msg"></p>
  </form>
  <div class="card">
    <h3>Direct contact</h3>
    <p>📧 <a data-site-href="email"><span data-site="email"></span></a></p>
    <p>📞 <span data-site="phone"></span></p>
    <p>📍 <span data-site="location"></span></p>
    <a class="btn ghost" href="appointments.html">Book an appointment</a>
  </div>
</div></section>

</main>
<footer id="site-footer"></footer>
<script src="assets/js/config.js"></script>
<script src="assets/js/layout.js"></script>
</body>
</html>
